<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>401 - EPHEMERA</title>
  <style>
	* {
	  box-sizing: border-box;
	}

	html,
	body {
	  margin: 0;
	  min-height: 100%;
	}

	body {
	  display: flex;
	  align-items: center;
	  justify-content: center;
	  padding: 32px 20px;
	  background-color: #111;
	  background-image: url("https://raw.githubusercontent.com/ephemeraonline/site/refs/heads/main/IMAGES/STAR_%20BG.gif");
	  background-repeat: repeat;
	  background-size: 412px auto;
	  font-family: Arial, Helvetica, sans-serif;
	}

	.error-wrap {
	  width: min(980px, 100%);
	  transform: rotate(-1.2deg);
	  filter: drop-shadow(0 18px 30px rgba(0,0,0,0.45));
	}

	.sticker {
	  position: relative;
	  background: #e44ae2;
	  border: 16px solid #111;
	  border-radius: 26px;
	  overflow: hidden;
	}

	.sticker::before {
	  left: -2px;
	}

	.sticker::after {
	  right: -2px;
	  transform: scaleX(-1);
	}

	.top-band {
	  position: relative;
	  z-index: 2;
	  background: #111;
	  color: #f21ae3;
	  padding: 22px 34px 16px;
	  font-weight: 900;
	  font-size: clamp(42px, 8vw, 108px);
	  line-height: 0.9;
	  letter-spacing: 1px;
	  text-transform: uppercase;
	}

	.body-band {
	  position: relative;
	  padding: 26px 34px 28px;
	  display: grid;
	  grid-template-columns: 1fr 220px;
	  gap: 24px;
	  align-items: end;
	}

	.copy {
	  color: #111;
	}

	.copy .line-1,
	.copy .line-2 {
	  font-size: clamp(28px, 4.2vw, 64px);
	  font-weight: 900;
	  line-height: 1.02;
	  margin: 0;
	  text-transform: none;
	}

	.copy .line-3 {
	  display: inline-block;
	  margin-top: 18px;
	  background: #111;
	  color: #f2d21b;
	  padding: 10px 16px 8px;
	  font-size: clamp(34px, 5.2vw, 74px);
	  font-weight: 900;
	  line-height: 1;
	  letter-spacing: 1px;
	}

	.badge-wrap {
	  display: flex;
	  justify-content: flex-end;
	  align-items: flex-end;
	}

	.badge {
	  position: relative;
	  width: 100%;
	  max-width: 220px;
	  min-height: 170px;
	  display: flex;
	  align-items: flex-end;
	  justify-content: flex-end;
	  overflow: visible;
	}

	.badge::before {
	  content: "";
	  position: absolute;
	  right: var(--badge-semi-right, 0px);
	  bottom: var(--badge-semi-bottom, 0px);
	  width: var(--badge-semi-w, 170px);
	  height: var(--badge-semi-h, 170px);
	  background: var(--badge-semi-color, #f5f0e8);
	  border-top: var(--badge-semi-border, 5px) solid #111;
	  border-left: var(--badge-semi-border, 5px) solid #111;
	  border-top-left-radius: 999px;
	  z-index: 0;
	}

	.badge-inner.badge-image {
	  position: relative;
	  z-index: 1;
	  display: flex;
	  align-items: center;
	  justify-content: center;
	  overflow: visible;
	}

	.badge-inner.badge-image img {
	  width: var(--badge-img-w, 140px);
	  max-width: none;
	  height: auto;
	  display: block;
	  transform: translate(var(--badge-img-x, 0px), var(--badge-img-y, 0px));
	}

	.subline {
	  margin-top: 18px;
	  font-size: clamp(14px, 1.5vw, 22px);
	  font-weight: 700;
	  line-height: 1.25;
	  color: #111;
	  opacity: 0.92;
	}

	.subline a {
	  color: inherit;
	  text-decoration-thickness: 3px;
	  text-underline-offset: 3px;
	}

	@media (max-width: 720px) {
	  .sticker {
		border-width: 12px;
		border-radius: 20px;
	  }

	  .top-band {
		padding: 18px 20px 14px;
	  }

	  .body-band {
		grid-template-columns: 1fr;
		gap: 18px;
		padding: 20px 20px 22px;
	  }

	  .badge-wrap {
		justify-content: flex-start;
	  }

	  .badge {
		max-width: 180px;
		min-height: 135px;
	  }

	  .sticker::before,
	  .sticker::after {
		width: 18px;
		background-size: 18px 20px;
	  }
	}
  </style>
</head>
<body>
  <div class="error-wrap">
	<div class="sticker">
	  <div class="top-band">401 ERROR</div>

	  <div class="body-band">
		<div class="copy">
		  <p class="line-1">Turn Your Computer off and go outside.</p>
		  <p class="line-2"> Trust Us. </p>
		  <div class="line-3">PAGE NOT FOUND.</div>

		  <div class="subline">
			maybe it moved, maybe it broke, maybe it was never here.<br>
			<a href="https://ephemeraonline.world/">we will never know</a>
		  </div>
		</div>

		<div class="badge-wrap">
		  <div
			class="badge"
			style="
			  --badge-semi-w: 180px;
			  --badge-semi-h: 180px;
			  --badge-semi-right: -34px;
			  --badge-semi-bottom: -30px;
			  --badge-semi-color: #f5f0e8;
			  --badge-semi-border: 10px;
			"
		  >
			<div
			  class="badge-inner badge-image"
			  style="
				--badge-img-w: 140px;
				--badge-img-x: 29px;
				--badge-img-y: 0px;
			  "
			>
			  <img
				src="https://raw.githubusercontent.com/ephemeraonline/site/refs/heads/main/IMAGES/EPH_BEST_BUY.png"
				alt="EPHEMERA logo"
			  />
			</div>
		  </div> 
		</div>
	  </div>
	</div>
  </div>
</body>
</html>
