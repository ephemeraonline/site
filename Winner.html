<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>401 ERROR - EPHEMERA</title>
  <style>
	* {
	  box-sizing: border-box;
	}

	html,
	body {
	  margin: 0;
	  min-height: 100%;
	}

	body {
	  display: flex;
	  align-items: center;
	  justify-content: center;
	  padding: 18px 12px;
	  background-color: #111;
	  background-image: url("https://raw.githubusercontent.com/ephemeraonline/site/refs/heads/main/IMAGES/STAR_%20BG.gif");
	  background-repeat: repeat;
	  background-size: 412px auto;
	  font-family: Arial, Helvetica, sans-serif;
	  overflow-x: hidden;
	}

	.error-wrap {
	  width: min(980px, 100%);
	  transform: rotate(-1.2deg);
	  transform-origin: center center;
	  filter: drop-shadow(0 18px 30px rgba(0,0,0,0.45));
	}

	.sticker {
	  position: relative;
	  background: #e44ae2;
	  border: 16px solid #111;
	  border-radius: 26px;
	  overflow: hidden;
	}

	.top-band {
	  position: relative;
	  z-index: 2;
	  background: #111;
	  color: #f21ae3;
	  padding: 22px 34px 16px;
	  font-weight: 900;
	  font-size: clamp(42px, 8vw, 108px);
	  line-height: 0.9;
	  letter-spacing: 1px;
	  text-transform: uppercase;
	}

	.body-band {
	  position: relative;
	  padding: 26px 34px 28px;
	  display: grid;
	  grid-template-columns: 1fr 220px;
	  gap: 24px;
	  align-items: end;
	}

	.copy {
	  color: #111;
	  min-width: 0;
	}

	.copy .line-1,
	.copy .line-2 {
	  font-size: clamp(28px, 4.2vw, 64px);
	  font-weight: 900;
	  line-height: 1.02;
	  margin: 0;
	  text-transform: none;
	}

	.copy .line-3 {
	  display: inline-block;
	  margin-top: 18px;
	  background: #111;
	  color: #f2d21b;
	  padding: 10px 16px 8px;
	  font-size: clamp(34px, 5.2vw, 74px);
	  font-weight: 900;
	  line-height: 1;
	  letter-spacing: 1px;
	}

	.badge-wrap {
	  display: flex;
	  justify-content: flex-end;
	  align-items: flex-end;
	}

	.badge {
	  position: relative;
	  width: 100%;
	  max-width: 220px;
	  min-height: 170px;
	  display: flex;
	  align-items: flex-end;
	  justify-content: flex-end;
	  overflow: visible;
	  flex-shrink: 0;
	}

	.badge::before {
	  content: "";
	  position: absolute;
	  right: var(--badge-semi-right, 0px);
	  bottom: var(--badge-semi-bottom, 0px);
	  width: var(--badge-semi-w, 170px);
	  height: var(--badge-semi-h, 170px);
	  background: var(--badge-semi-color, #f5f0e8);
	  border-top: var(--badge-semi-border, 5px) solid #111;
	  border-left: var(--badge-semi-border, 5px) solid #111;
	  border-top-left-radius: 999px;
	  z-index: 0;
	}

	.badge-inner.badge-image {
	  position: relative;
	  z-index: 1;
	  display: flex;
	  align-items: center;
	  justify-content: center;
	  overflow: visible;
	}

	.badge-inner.badge-image img {
	  width: var(--badge-img-w, 140px);
	  max-width: none;
	  height: auto;
	  display: block;
	  transform: translate(var(--badge-img-x, 0px), var(--badge-img-y, 0px));
	}

	.subline {
	  margin-top: 18px;
	  font-size: clamp(14px, 1.5vw, 22px);
	  font-weight: 700;
	  line-height: 1.25;
	  color: #111;
	  opacity: 0.92;
	}

	.subline a {
	  color: inherit;
	  text-decoration-thickness: 3px;
	  text-underline-offset: 3px;
	}

	@media (max-width: 720px) {
	  .error-wrap {
		width: 100%;
		max-width: 560px;
		transform: rotate(-0.6deg) scale(0.94);
	  }

	  .sticker {
		border-width: 12px;
		border-radius: 20px;
	  }

	  .top-band {
		padding: 18px 20px 14px;
		font-size: clamp(34px, 12vw, 72px);
	  }

	  .body-band {
		grid-template-columns: 1fr;
		gap: 18px;
		padding: 20px 20px 22px;
	  }

	  .copy .line-1,
	  .copy .line-2 {
		font-size: clamp(22px, 7vw, 42px);
		line-height: 1.04;
	  }

	  .copy .line-3 {
		margin-top: 14px;
		padding: 9px 12px 7px;
		font-size: clamp(24px, 8vw, 44px);
		line-height: 1;
	  }

	  .subline {
		margin-top: 16px;
		font-size: 15px;
		line-height: 1.35;
	  }

	  .badge-wrap {
		justify-content: flex-start;
	  }

	  .badge {
		max-width: 160px;
		min-height: 120px;
	  }

	  .badge::before {
		width: var(--badge-semi-w-mobile, var(--badge-semi-w, 120px)) !important;
		height: var(--badge-semi-h-mobile, var(--badge-semi-h, 120px)) !important;
		right: var(--badge-semi-right-mobile, var(--badge-semi-right, -18px)) !important;
		bottom: var(--badge-semi-bottom-mobile, var(--badge-semi-bottom, -18px)) !important;
		border-top-width: var(--badge-semi-border-mobile, 7px) !important;
		border-left-width: var(--badge-semi-border-mobile, 7px) !important;
	  }

	  .badge-inner.badge-image img {
		width: var(--badge-img-w-mobile, var(--badge-img-w, 96px)) !important;
		transform: translate(
		  var(--badge-img-x-mobile, var(--badge-img-x, 16px)),
		  var(--badge-img-y-mobile, var(--badge-img-y, 0px))
		) !important;
	  }
	}

	@media (max-width: 480px) {
	  body {
		padding: 14px 10px;
	  }

	  .error-wrap {
		transform: rotate(-0.35deg) scale(0.88);
	  }

	  .sticker {
		border-width: 10px;
		border-radius: 18px;
	  }

	  .top-band {
		padding: 14px 16px 12px;
		font-size: clamp(28px, 11vw, 56px);
		line-height: 0.92;
	  }

	  .body-band {
		padding: 16px 16px 18px;
		gap: 14px;
	  }

	  .copy .line-1,
	  .copy .line-2 {
		font-size: clamp(18px, 6.8vw, 32px);
	  }

	  .copy .line-3 {
		font-size: clamp(20px, 7.2vw, 34px);
		padding: 8px 10px 7px;
	  }

	  .subline {
		font-size: 13px;
		margin-top: 14px;
	  }

	  .badge {
		max-width: 132px;
		min-height: 96px;
	  }
	}
  </style>
</head>
<body>
  <div class="error-wrap">
	<div class="sticker">
	  <div class="top-band">401 ERROR</div>

	  <div class="body-band">
		<div class="copy">
		  <p class="line-1">This page doesn’t exist. Not everything is meant to be found.</p>
		  <div class="line-3">PAGE NOT FOUND.</div>

		  <div class="subline">
			Turn off your computer and go outside.<br>
			<a href="https://ephemeraonline.world/">we will be here when you get back &lt;3</a>
		  </div>
		</div>

		<div class="badge-wrap">
		  <div
			class="badge"
			style="
			  --badge-semi-w: 180px;
			  --badge-semi-h: 180px;
			  --badge-semi-right: -34px;
			  --badge-semi-bottom: -30px;
			  --badge-semi-color: #f5f0e8;
			  --badge-semi-border: 10px;

			  --badge-semi-w-mobile: 150px;
			  --badge-semi-h-mobile: 150px;
			  --badge-semi-right-mobile: -236px;
			  --badge-semi-bottom-mobile: -22px;
			  --badge-semi-border-mobile: 8px;
			"
		  >
			<div
			  class="badge-inner badge-image"
			  style="
				--badge-img-w: 140px;
				--badge-img-x: 29px;
				--badge-img-y: 0px;

				--badge-img-w-mobile: 108px;
				--badge-img-x-mobile: 220px;
				--badge-img-y-mobile: 4px;
			  "
			>
			  <img
				src="https://raw.githubusercontent.com/ephemeraonline/site/refs/heads/main/IMAGES/EPH_BEST_BUY.png"
				alt="EPHEMERA logo"
			  />
			</div>
		  </div> 
		</div>
	  </div>
	</div>
  </div>
</body>
</html>
