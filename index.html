<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>★EPHEMERA★</title>

<style>
/* ==================================================
   GLOBAL / CURSOR
   Site-wide cursor + typography
================================================== */

* {
  cursor: url("https://raw.githubusercontent.com/ephemeraonline/site/refs/heads/main/IMAGES/EPH_CURSOR_GOOD.png"), auto !important;
}

a, button, img, .orbit {
  cursor: url("https://raw.githubusercontent.com/ephemeraonline/site/refs/heads/main/IMAGES/EPH_CURSOR_BAD.png"), pointer !important;
}

body {
  margin: 0;
  background: #FFFFFF;
  overflow-x: hidden;
  color: #000;
  font-family: 'NurealRegular', sans-serif;
}

/* Custom font */
@font-face {
  font-family: 'NurealRegular';
  src: url('https://files.catbox.moe/zcgiwn.woff2') format('woff2');
}

/* ==================================================
   FALLING STARS (background ambience)
   Decorative only — no interaction
================================================== */

.star {
  position: absolute;
  top: -60px;
  pointer-events: none;
  animation: fall linear infinite;
  z-index: 1;
}

.star img {
  width: 100%;
  height: auto;
  display: block;
  opacity: 0.95;
  filter: drop-shadow(0 0 6px rgba(0,0,0,0.2));
}

@keyframes fall {
  to {
    transform: translateY(200vh) rotate(360deg);
    opacity: 0;
  }
}

/* ==================================================
   DECOR PLANET (main centerpiece image)
   Logo / hero graphic
================================================== */

#decor-e {
  display: block;
  margin: 40px auto;
  width: 350px;
  height: auto;
  z-index: 10; 
}

/* ==================================================
   ORBIT SYSTEM
   Floating navigation / badges / stickers
================================================== */

.orbit-container {
  position: relative;
  width: 300px;
  height: 300px;
  margin: 40px auto;
  pointer-events: none;
  z-index: 10;
}

.orbit {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 150px;
  pointer-events: auto;
  z-index: 10;

  /* Manual placement system */
  transform:
    translate(-50%, -50%)
    translate(var(--x), var(--y))
    rotate(var(--r, 0deg))
    scale(var(--s, 1));

  animation: float 6s ease-in-out infinite;
  transition: transform 0.4s ease;
}

/* Hover snaps upright */
.orbit:hover {
  animation-play-state: paused;
  transform:
    translate(-50%, -50%)
    translate(var(--x), var(--y))
    rotate(0deg)
    scale(1.05);
}

/* ==================================================
   WELCOME BANNER
   Large image header / announcement / seasonal banner
================================================== */

.welcome-banner {
  position: relative;
  width: 720px;
  max-width: 100%;
  margin: 40px auto;
  z-index: 10;
  display: block;

  /* Same placement controls as decor */
  transform:
    translate(var(--x, 0px), var(--y, 0px))
    rotate(var(--r, 0deg))
    scale(var(--s, 1));
}

/* ==================================================
   AERO WINDOWS
   Main content blocks (stack vertically)
================================================== */

.aero-window {
  position: relative;
  margin: 40px auto;
  width: 700px;
  max-width: 90%;

  /* Glass / Aero look */
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255,255,255,0.6);
  border-radius: 12px;
  box-shadow:
    0 0 20px rgba(0, 150, 255,0.2),
    0 8px 32px rgba(0,0,0,0.1);
  backdrop-filter: blur(12px);

  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* Window title bar */
.aero-header {
  height: 40px;
  background: linear-gradient(
    180deg,
    #5c9ee8 0%,
    #1e62d0 50%,
    #134bb0 51%,
    #458ce0 100%
  );
  display: flex;
  align-items: center;
  padding-left: 15px;
  border-bottom: 1px solid #0d3882;
}

.aero-title {
  color: white;
  font-size: 14px;
  font-weight: bold;
  font-family: Verdana;
}

/* Window content area */
.aero-content {
  padding: 20px;
  background: rgba(168,198,227,0.309);
}

/* Optional decorative headings inside windows */
.aero-content h3,
h4 {
  text-align: center;
  background: linear-gradient(
    90deg,
    red, orange, yellow, green, blue, indigo, violet
  );
  background-size: 400% 100%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: rainbow 5s linear infinite;
}

@keyframes rainbow {
  0% { background-position: 0% 0%; }
  100% { background-position: 100% 0%; }
}
</style>
</head>

<body>

<!-- ==================================================
     HERO / LOGO IMAGE
     Main brand graphic
================================================== -->
<img id="decor-e"
     src="https://i.ibb.co/3mv0DPQ0/INTERNET-E-WITH-STROKE.png"
     alt="EPHEMERA logo">

<!-- ==================================================
     ORBITING DECOR
     Could be:
     - Navigation buttons
     - About / Work / Contact links
     - Decorative badges
================================================== -->
<div class="orbit-container">

  <!-- Example: Featured project / flyer -->
  <img class="orbit"
       src="https://raw.githubusercontent.com/ephemeraonline/site/refs/heads/main/IMAGES/FLYERS_ROUGH.png"
       style="--x:-200px; --y:-20px; --r:-15deg; --s:1.5;">

  <!-- Example: About page link -->
  <img class="orbit"
       src="https://raw.githubusercontent.com/ephemeraonline/site/refs/heads/main/IMAGES/EPHEMERA_ABOUT.png"
       style="--x:130px; --y:-50px; --r:10deg;">

  <!-- Example: Work / portfolio -->
  <img class="orbit"
       src="https://raw.githubusercontent.com/ephemeraonline/site/refs/heads/main/IMAGES/EPHEMERA_WORK.png"
       style="--x:-340px; --y:200px; --r:-15deg;">

  <!-- Example: Contact -->
  <img class="orbit"
       src="https://raw.githubusercontent.com/ephemeraonline/site/refs/heads/main/IMAGES/EPHEMERA_CONTACT.png"
       style="--x:5px; --y:200px; --r:-15deg;">

  <!-- Example: Social links -->
  <img class="orbit"
       src="https://raw.githubusercontent.com/ephemeraonline/site/refs/heads/main/IMAGES/EPHEMERA_SOCIALS.png"
       style="--x:300px; --y:200px; --r:25deg;">
</div>

<!-- ==================================================
     WELCOME / ANNOUNCEMENT BANNER
     Could be:
     - “Under construction”
     - Seasonal art
     - Big statement graphic
================================================== -->
<div class="welcome-banner"
     style="--x: 0px; --y: 250px; --r: 0deg;">
  <img src="https://raw.githubusercontent.com/ephemeraonline/site/refs/heads/main/IMAGES/welcome_banner.gif"
       alt="Welcome banner">
</div>

<!-- ==================================================
     AERO WINDOW: INTRO / STATUS
     Could be:
     - About text
     - Site status
     - Update log
================================================== -->
<div class="aero-window">
  <div class="aero-header">
    <div class="aero-title">★ WELCOME ★</div>
  </div>
  <div class="aero-content">
    <h4>Hi! We are EPHEMERA</h4>
    <p>A small creative studio run by two friends with too many browser tabs open.</p>
  </div>
</div>

<!-- ==================================================
     AERO WINDOW: SECONDARY CONTENT
     Could be:
     - News
     - Projects
     - Embedded media
================================================== -->
<div class="aero-window">
  <div class="aero-header">
    <div class="aero-title">★ Another Section ★</div>
  </div>
  <div class="aero-content">
    <h3>second box here</h3>
    <p>can add more windows</p>
  </div>
</div>

<!-- ==================================================
     FALLING STARS SCRIPT
     Background decoration only
================================================== -->
<script>
const STAR_IMAGES = [
  "https://images.squarespace-cdn.com/content/696470c0cb786e54bb4d51fc/09f463bd-691c-42de-a6b0-5878f2176910/EPH_BLUE_STAR.png",
  "https://images.squarespace-cdn.com/content/696470c0cb786e54bb4d51fc/1df543d8-bc29-4b4b-9a1c-dd5509035dbe/EPH_GREEN_STAR.png",
  "https://images.squarespace-cdn.com/content/696470c0cb786e54bb4d51fc/bad2569d-fcdd-4592-9618-2519bd5e3662/EPH_PINK_STAR.png"
];

for (let i = 0; i < 50; i++) {
  const star = document.createElement("div");
  star.className = "star";
  const img = document.createElement("img");
  img.src = STAR_IMAGES[Math.floor(Math.random() * STAR_IMAGES.length)];
  star.style.left = Math.random() * window.innerWidth + "px";
  star.style.width = Math.random() * 18 + 12 + "px";
  star.style.animationDuration = Math.random() * 15 + 10 + "s";
  star.style.animationDelay = Math.random() * -15 + "s";
  star.appendChild(img);
  document.body.appendChild(star);
}
</script>

</body>
</html>
