<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>★EPHEMERA★</title>

<style>
/* =====================
   GLOBAL / CURSOR
===================== */

* {
  cursor: url("https://raw.githubusercontent.com/ephemeraonline/site/refs/heads/main/IMAGES/EPH_CURSOR_GOOD.png"), auto !important;
}

a, button, img, .orbit {
  cursor: url("https://raw.githubusercontent.com/ephemeraonline/site/refs/heads/main/IMAGES/EPH_CURSOR_BAD.png"), pointer !important;
}

body {
  margin: 0;
  background: #FFFFFF;
  overflow-x: hidden;
  color: #000;
  font-family: 'NurealRegular', sans-serif;
}

/* fonts */
@font-face {
  font-family: 'NurealRegular';
  src: url('https://files.catbox.moe/zcgiwn.woff2') format('woff2');
}

/* =====================
   FALLING STARS
===================== */

.star {
  position: absolute;
  top: -60px;
  pointer-events: none;
  animation: fall linear infinite;
  z-index: 1;
}

.star img {
  width: 100%;
  height: auto;
  display: block;
  opacity: 0.95;
  filter: drop-shadow(0 0 6px rgba(0,0,0,0.2));
}

@keyframes fall {
  to {
    transform: translateY(200vh) rotate(360deg);
    opacity: 0;
  }
}

/* =====================
   DECOR PLANET
===================== */

#decor-e {
  display: block;
  margin: 40px auto;
  width: 350px;
  height: auto;
  z-index: 10; 
}

/* =====================
   ORBIT SYSTEM
===================== */

.orbit-container {
  position: relative;
  width: 300px;
  height: 300px;
  margin: 40px auto;
  pointer-events: none;
  z-index: 10;
}

.orbit {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 150px;
  pointer-events: auto;
  z-index: 10;

  transform:
    translate(-50%, -50%)
    translate(var(--x), var(--y))
    rotate(var(--r, 0deg))
    scale(var(--s, 1));

  animation: float 6s ease-in-out infinite;
  transition: transform 0.4s ease;
}

/* =====================
   WELCOME BANNER PLACEHOLDER
===================== */

.welcome-banner {
  margin: 30px auto;
  width: 700px;
  max-width: 90%;
  text-align: center;
}
</style>
</head>

<body>

<!-- Decor planet -->
<img id="decor-e" src="https://i.ibb.co/3mv0DPQ0/INTERNET-E-WITH-STROKE.png" alt="E">

<!-- Orbiting decor -->
<div class="orbit-container">
  <img class="orbit"
   src="https://raw.githubusercontent.com/ephemeraonline/site/refs/heads/main/IMAGES/FLYERS_ROUGH.png"
   style="--x:-200px; --y:-20px; --r:-15deg; --s:1.5;">
   
  <img class="orbit"
   src="https://raw.githubusercontent.com/ephemeraonline/site/refs/heads/main/IMAGES/EPHEMERA_ABOUT.png"
   style="--x:130px; --y:-50px; --r:10deg;">
   
  <img class="orbit"
   src="https://raw.githubusercontent.com/ephemeraonline/site/refs/heads/main/IMAGES/EPHEMERA_WORK.png"
   style="--x:-340px; --y:200px; --r:-15deg;">
    
  <img class="orbit"
   src="https://raw.githubusercontent.com/ephemeraonline/site/refs/heads/main/IMAGES/EPHEMERA_CONTACT.png"
   style="--x:5px; --y:200px; --r:-15deg;">
    
  <img class="orbit"
   src="https://raw.githubusercontent.com/ephemeraonline/site/refs/heads/main/IMAGES/EPHEMERA_SOCIALS.png"
   style="--x:300px; --y:200px; --r:25deg;">
</div>

<!-- Welcome banner placeholder -->
<div class="welcome-banner">
  <!-- Replace src with your banner image -->
  <img src="" alt="Welcome banner" style="width:100%; height:auto;">
</div>

<!-- Aero windows -->
<div class="aero-window">
  ...
</div>

</body>
</html>
