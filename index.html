/* ==================================================
   FALLING STARS
================================================== */
.star {
  position: absolute;
  top: -60px;
  pointer-events: none;
  animation: fall linear infinite;
  z-index: 1;
}
.star img {
  width: 100%;
  height: auto;
  display: block;
  opacity: 0.95;
  filter: drop-shadow(0 0 6px rgba(0,0,0,0.2));
}
@keyframes fall {
  to { transform: translateY(200vh) rotate(360deg); opacity: 0; }
}

   DECOR PLANET
================================================== */
#decor-e {
  display: block;

/* ==================================================
   ORBIT SYSTEM
================================================== */
.orbit-container {
  position: relative;
  width: 300px;
  height: 300px;
  margin: 40px auto;
  pointer-events: none;
  z-index: 10;
}
.orbit {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 150px;
  pointer-events: auto;
  z-index: 10;
  transform:
    translate(-50%, -50%)
    translate(var(--x), var(--y))
    rotate(var(--r, 0deg))
    scale(var(--s, 1));
  animation: float 6s ease-in-out infinite;
  transition: transform 0.4s ease;
}
.orbit:hover {
  animation-play-state: paused;
  transform:
    translate(-50%, -50%)
    translate(var(--x), var(--y))
    rotate(0deg)
    scale(1.05);
}
@keyframes float {
  0%, 100% {
    transform:
      translate(-50%, -50%)
      translate(var(--x), var(--y))
      rotate(var(--r, 0deg))
      scale(var(--s, 1));
  }
  50% {
    transform:
      translate(-50%, -50%)
      translate(calc(var(--x) + 6px), calc(var(--y) - 6px))
      rotate(var(--r, 0deg))
      scale(var(--s, 1));
  }
}

/* ==================================================
   WELCOME BANNER
================================================== */

<script>
/* ==================================================
   FALLING STARS
================================================== */
const STAR_IMAGES = [
  "https://images.squarespace-cdn.com/content/696470c0cb786e54bb4d51fc/09f463bd-691c-42de-a6b0-5878f2176910/EPH_BLUE_STAR.png",
  "https://images.squarespace-cdn.com/content/696470c0cb786e54bb4d51fc/1df543d8-bc29-4b4b-9a1c-dd5509035dbe/EPH_GREEN_STAR.png",
  "https://images.squarespace-cdn.com/content/696470c0cb786e54bb4d51fc/bad2569d-fcdd-4592-9618-2519bd5e3662/EPH_PINK_STAR.png"
];

for (let i = 0; i < 50; i++) {
  const star = document.createElement("div");
  star.className = "star";
  const img = document.createElement("img");
  img.src = STAR_IMAGES[Math.floor(Math.random() * STAR_IMAGES.length)];
  star.style.left = Math.random() * window.innerWidth + "px";
  star.style.width = (Math.random() * 18 + 12) + "px";
  star.style.animationDuration = (Math.random() * 15 + 10) + "s";
  star.style.animationDelay = (Math.random() * -15) + "s";
  star.appendChild(img);
  document.body.appendChild(star);
}

/* ==================================================
   MUSIC PLAYER SCRIPT
================================================== */
let track_name = document.querySelector(".songtitle");
let seek_slider = document.querySelector(".seek_slider");
let curr_time = document.querySelector(".current-time");
let total_duration = document.querySelector(".total-duration");

let track_index = 0;
let isPlaying = false;
let updateTimer;

let curr_track = document.getElementById("music");

let track_list = [
  { name: "One Shot One Kill - The Cat's Whiskers", path: "https://files.catbox.moe/fegzmf.mp3" },
  { name: "Shooting Arrows - The Cat's Whiskers", path: "https://files.catbox.moe/zj81lr.mp3" },
  { name: "4 REAL - The Cat's Whiskers", path: "https://files.catbox.moe/fxd8fo.mp3" },
  { name: "My Sweetest Love - The Cat's Whiskers ft. Kazuma Mitchell", path: "https://files.catbox.moe/qe4he5.mp3" },
  { name: "Mercy On Me - The Cat's Whiskers", path: "https://files.catbox.moe/w7nnf9.mp3" }
];

function loadTrack(index) {
  clearInterval(updateTimer);
  resetValues();

  curr_track.src = track_list[index].path;
  curr_track.load();

  track_name.textContent = track_list[index].name;

  updateTimer = setInterval(seekUpdate, 1000);
  curr_track.addEventListener("ended", nextTrack);
}

function resetValues() {
  curr_time.textContent = "0:00";
  total_duration.textContent = "0:00";
  seek_slider.value = 0;
}

function playpauseTrack() {
  if (!isPlaying) playTrack();
  else pauseTrack();
}

function playTrack() {
  curr_track.play();
  isPlaying = true;
  let playButton = document.querySelector(".playpause-track");
  playButton.className = "playpause-track fas fa-pause";
}

function pauseTrack() {
  curr_track.pause();
  isPlaying = false;
  let playButton = document.querySelector(".playpause-track");
  playButton.className = "playpause-track fas fa-play";
}

function nextTrack() {
  if (track_index < track_list.length - 1) track_index += 1;
  else track_index = 0;

  loadTrack(track_index);
  if (isPlaying) playTrack();
}

function prevTrack() {
  if (track_index > 0) track_index -= 1;
  else track_index = track_list.length - 1;

  loadTrack(track_index);
  if (isPlaying) playTrack();
}

let currentVolume = curr_track.volume;

function volumeUp() {
  if (currentVolume < 1.0) {
    currentVolume = Math.min(1.0, currentVolume + 0.2);
    curr_track.volume = currentVolume;
  }
}

function volumeDown() {
  if (currentVolume > 0.0) {
    currentVolume = Math.max(0.0, currentVolume - 0.2);
    curr_track.volume = currentVolume;
  }
}

function seekTo() {
  let seekto = curr_track.duration * (seek_slider.value / 100);
  curr_track.currentTime = seekto;
}

function seekUpdate() {
  let seekPosition = 0;

  if (!isNaN(curr_track.duration)) {
    seekPosition = curr_track.currentTime * (100 / curr_track.duration);
    seek_slider.value = seekPosition;

    let currentMinutes = Math.floor(curr_track.currentTime / 60);
    let currentSeconds = Math.floor(curr_track.currentTime - currentMinutes * 60);
    let durationMinutes = Math.floor(curr_track.duration / 60);
    let durationSeconds = Math.floor(curr_track.duration - durationMinutes * 60);

    if (currentSeconds < 10) currentSeconds = "0" + currentSeconds;
    if (durationSeconds < 10) durationSeconds = "0" + durationSeconds;

    curr_time.textContent = currentMinutes + ":" + currentSeconds;
    total_duration.textContent = durationMinutes + ":" + durationSeconds;
  }
}

loadTrack(track_index);

/* ==================================================
   DRAGGABLE (mouse + touch)
================================================== */
(function makeDraggable() {
  const dragWrap = document.getElementById("player-drag");
  const handle = document.getElementById("player-handle");
  const playerEl = document.getElementById("player");

  let isDragging = false;
  let startX = 0, startY = 0;
  let startLeft = 0, startTop = 0;

  // set initial position using left/top (so dragging math is easy)
  // (convert bottom/left initial into left/top once)
  const rect = dragWrap.getBoundingClientRect();
  dragWrap.style.left = rect.left + "px";
  dragWrap.style.top = rect.top + "px";
  dragWrap.style.bottom = "auto";

  function clamp(n, min, max) { return Math.max(min, Math.min(max, n)); }

  function pointerDown(e) {
    // don't start drag when interacting with controls
    const t = e.target;
    if (t.closest("button") || t.closest("input") || t.closest("a") || t.closest("select") || t.closest("textarea")) {
      return;
    }

    isDragging = true;
    playerEl.classList.add("dragging");

    const p = (e.touches && e.touches[0]) ? e.touches[0] : e;
    startX = p.clientX;
    startY = p.clientY;

    const r = dragWrap.getBoundingClientRect();
    startLeft = r.left;
    startTop = r.top;

    e.preventDefault();
  }

  function pointerMove(e) {
    if (!isDragging) return;

    const p = (e.touches && e.touches[0]) ? e.touches[0] : e;
    const dx = p.clientX - startX;
    const dy = p.clientY - startY;

    const wrapRect = dragWrap.getBoundingClientRect();
    const maxLeft = window.innerWidth - wrapRect.width;
    const maxTop = window.innerHeight - wrapRect.height;

    const nextLeft = clamp(startLeft + dx, 0, maxLeft);
    const nextTop = clamp(startTop + dy, 0, maxTop);

    dragWrap.style.left = nextLeft + "px";
    dragWrap.style.top = nextTop + "px";
  }

  function pointerUp() {
    if (!isDragging) return;
    isDragging = false;
    playerEl.classList.remove("dragging");
  }

  handle.addEventListener("mousedown", pointerDown);
  window.addEventListener("mousemove", pointerMove);
  window.addEventListener("mouseup", pointerUp);

  handle.addEventListener("touchstart", pointerDown, { passive: false });
  window.addEventListener("touchmove", pointerMove, { passive: true });
  window.addEventListener("touchend", pointerUp);
})();
</script>
