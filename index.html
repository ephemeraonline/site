<style>
/* ==================================================
   GLOBAL / CURSOR
================================================== */
* {
  cursor: url("https://raw.githubusercontent.com/ephemeraonline/site/refs/heads/main/IMAGES/EPH_CURSOR_GOOD.png"), auto !important;
}

a, button, img, .orbit {
  cursor: url("https://raw.githubusercontent.com/ephemeraonline/site/refs/heads/main/IMAGES/EPH_CURSOR_BAD.png"), pointer !important;
}

body {
  margin: 0;
  background: #FFFFFF;
  overflow-x: hidden;
  color: #000;
  font-family: 'Helvetica', sans-serif;
  font-size: 12px;
}

@font-face {

  src: url('https://files.catbox.moe/zcgiwn.woff2') format('woff2');

/* ==================================================
   FALLING STARS
================================================== */
.star {
  position: absolute;
  top: -60px;
  pointer-events: none;
  animation: fall linear infinite;
  z-index: 1;
}
.star img {
  width: 100%;
  height: auto;
  display: block;
  opacity: 0.95;
  filter: drop-shadow(0 0 6px rgba(0,0,0,0.2));
}
@keyframes fall {
  to { transform: translateY(200vh) rotate(360deg); opacity: 0; }
}

/* ==================================================
   DECOR PLANET
================================================== */
#decor-e {
  display: block;
  margin: 40px auto;
  width: 350px;
  height: auto;
  z-index: 50;
}

/* ==================================================
   ORBIT SYSTEM
================================================== */
.orbit-container {
  position: relative;
  width: 300px;
  height: 300px;
  margin: 40px auto;
  pointer-events: none;
  z-index: 10;
}

.orbit {
  position: absolute;
  top: 50%;
  left: 50%;
  width: 150px;                /* FLYERS_ROUGH stays same size */
  pointer-events: auto;
  z-index: 10;
  transform:
    translate(-50%, -50%)
    translate(var(--x), var(--y))
    rotate(var(--r, 0deg))
    scale(var(--s, 1));
  animation: float 6s ease-in-out infinite;
  transition: transform 0.2s ease;
  will-change: transform;
}

/* subtle wiggle on hover, keeps each orbit's own --r and --s */
.orbit:hover {
  animation:
    float 6s ease-in-out infinite,
    orbitWiggle 0.9s ease-in-out infinite;
}

/* float stays as-is */
@keyframes float {
  0%, 100% {
    transform:
      translate(-50%, -50%)
      translate(var(--x), var(--y))
      rotate(var(--r, 0deg))
      scale(var(--s, 1));
  }
  50% {
    transform:
      translate(-50%, -50%)
      translate(calc(var(--x) + 6px), calc(var(--y) - 6px))
      rotate(var(--r, 0deg))
      scale(var(--s, 1));
  }
}

/* NEW: more subtle wiggle (tiny rotate + 1px nudge) */
@keyframes orbitWiggle {
  0% {
    transform:
      translate(-50%, -50%)
      translate(var(--x), var(--y))
      rotate(calc(var(--r, 0deg) - 0.7deg))
      scale(var(--s, 1));
  }
  25% {
    transform:
      translate(-50%, -50%)
      translate(calc(var(--x) + 1px), calc(var(--y) - 1px))
      rotate(calc(var(--r, 0deg) + 0.9deg))
      scale(var(--s, 1));
  }
  50% {
    transform:
      translate(-50%, -50%)
      translate(var(--x), var(--y))
      rotate(calc(var(--r, 0deg) - 0.9deg))
      scale(var(--s, 1));
  }
  75% {
    transform:
      translate(-50%, -50%)
      translate(calc(var(--x) - 1px), calc(var(--y) + 1px))
      rotate(calc(var(--r, 0deg) + 0.7deg))
      scale(var(--s, 1));
  }
  100% {
    transform:
      translate(-50%, -50%)
      translate(var(--x), var(--y))
      rotate(calc(var(--r, 0deg) - 0.7deg))
      scale(var(--s, 1));
  }
}

/* ==================================================
   WELCOME BANNER
================================================== */
.welcome-banner {
  position: relative;
  width: 720px;
  max-width: 100%;
  margin: 40px auto;
  z-index: 10;
  display: block;
  transform:
    translate(var(--x, 0px), var(--y, 210px))
    rotate(var(--r, 0deg))
    scale(var(--s, 1));
}

/* ==================================================
   AERO WINDOWS
================================================== */
.aero-window {
  position: relative;
  margin: 40px auto;
  width: 700px;
  max-width: 90%;
  background: rgba(255, 255, 255, 0.1);
  border: 1px solid rgba(255,255,255,0.6);
  border-radius: 12px;
  box-shadow:
    0 0 20px rgba(0, 150, 255,0.2),
    0 8px 32px rgba(0,0,0,0.1);
  backdrop-filter: blur(12px);
  display: flex;
  flex-direction: column;
  overflow: hidden;
  transform:
    translate(var(--x, 0px), var(--y, 250px))
    rotate(var(--r, 0deg))
    scale(var(--s, 1));
}

.aero-header {
  height: 40px;
  background-color: #907cff;
  display: flex;
  align-items: center;
  padding-left: 15px;
  border-bottom: 1px solid #0d3882;
}

.aero-title {
  color: white;
  font-size: 14px;
  font-weight: bold;
  font-family: Verdana;
}

.aero-content {
  padding: 15px;
  background-color: #e9e9e9;
  font-size: 16px;
  width: fit-content;
  font-weight: bold;
}

.aero-content h3,
h4 {
  text-align: center;
  font-size: 40px;
  background: linear-gradient(
    90deg,
    red, orange, yellow, green, blue, indigo, violet
  );
  background-size: 400% 100%;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  animation: rainbow 5s linear infinite;
  width: fit-content;
}

@keyframes rainbow {
  0% { background-position: 0% 0%; }
  100% { background-position: 100% 0%; }
}

/* ==================================================
   SECOND AERO WINDOW TWEAKS (ONLY)
================================================== */
.aero-window.aero-window--second {
  width: 320px;
  max-width: 92%;
  transform: translate(var(--x, 0px), var(--y, 250px)) rotate(var(--r, 0deg)) scale(var(--s, 1));
}

.aero-window.aero-window--second .aero-content {
  padding: 15px;
  background-color: #e9e9e9;
  font-size: 16px;
  font-weight: bold;
  width: fit-content;
}

/* ==================================================
   AERO CLOCK WIDGET (NEW)
================================================== */
#ephemera-clock {
  position: fixed;
  bottom: 20px;
  right: 84px; /* moved left so it doesn't collide with your mute button */
  z-index: 1000001;

  padding: 1px;
  border-radius: 14px;
  background: linear-gradient(
    to bottom,
    rgba(255,255,255,0.9),
    rgba(200,220,255,0.6)

  box-shadow:
    0 0 20px rgba(120,180,255,0.35),
    inset 0 0 8px rgba(255,255,255,0.75);
}

#ephemera-clock .clock-inner {
  background: rgba(255,255,255,0.65);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);

  border-radius: 13px;
  padding: 10px 14px;

  user-select: none;
  pointer-events: none; /* so it never blocks clicks */
}

#clock-date {

}

#clock-time {

}

/* ==================================================
   STICKERS LAYER (NEW)
   Adjustable GIF/PNG placement using CSS variables
================================================== */
.sticker-layer {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 9000; /* above content but below overlays */
}

.sticker {
  position: absolute;
  left: 0;
  top: 0;
  width: var(--w, 120px);
  height: auto;
  opacity: var(--o, 1);
  transform:
    translate(var(--x, 50px), var(--y, 50px))
    rotate(var(--r, 0deg))
    scale(var(--s, 1));
  filter: drop-shadow(0 0 6px rgba(0,0,0,0.2));
}

.sticker img {
  width: 100%;
  height: auto;
  display: block;
}

/* ==================================================
   AERO GALLERY MODAL (UPDATED)
================================================== */
.aero-overlay {
  position: fixed;
  inset: 0;
  display: none;
  place-items: center;
  z-index: 999999;
  background: rgba(0,0,0,0.25);
  backdrop-filter: blur(2px);
}
.aero-overlay.is-open { display: grid; }

.aero-gallery {
  width: min(880px, calc(100vw - 28px));
  height: min(560px, calc(100vh - 28px));
  overflow: hidden;
  transform: none;
}

.aero-gallery-body {
  height: calc(100% - 40px - 56px);
  display: grid;
  grid-template-columns: 56px 1fr 56px;
  gap: 10px;
  padding: 12px;
  align-items: center;
}

.aero-stage {
  height: 100%;
  border-radius: 14px;
  background: rgba(255,255,255,0.35);
  border: 1px solid rgba(0,0,0,0.10);
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.65);
  display: grid;
  place-items: center;
  overflow: hidden;
  padding: 10px;
}

.aero-zoomwrap {
  width: 100%;
  height: 100%;
  display: grid;
  place-items: center;
  overflow: hidden;
  cursor: default;
}

#aero-gallery-img {
  max-width: 100%;
  max-height: 100%;

  border-radius: 12px;

}

.aero-overlay.is-zoomed .aero-zoomwrap { cursor: grab; }

#aero-gallery-zoom {

<!-- ==================================================
     STICKERS (NEW)
     Edit the s
