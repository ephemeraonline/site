<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>401 - EPHEMERA</title>
  <style>
	* {
	  box-sizing: border-box;
	}

	html,
	body {
	  margin: 0;
	  min-height: 100%;
	}

body {
	  display: flex;
	  align-items: center;
	  justify-content: center;
	  padding: 32px 20px;
	  background-color: #111;
	  background-image: url("https://raw.githubusercontent.com/ephemeraonline/site/refs/heads/main/IMAGES/STAR_%20BG.gif");
	  background-repeat: repeat;
	  background-size: 412px auto;
	  font-family: Arial, Helvetica, sans-serif;
	}

	.error-wrap {
	  width: min(980px, 100%);
	  transform: rotate(-1.2deg);
	  filter: drop-shadow(0 18px 30px rgba(0,0,0,0.45));
	}

	.sticker {
	  position: relative;
	  background: #e44ae2;
	  border: 16px solid #111;
	  border-radius: 26px;
	  overflow: hidden;
	}


	.sticker::before {
	  left: -2px;
	}

	.sticker::after {
	  right: -2px;
	  transform: scaleX(-1);
	}

	.top-band {
	  position: relative;
	  z-index: 2;
	  background: #111;
	  color: #f21ae3;
	  padding: 22px 34px 16px;
	  font-weight: 900;
	  font-size: clamp(42px, 8vw, 108px);
	  line-height: 0.9;
	  letter-spacing: 1px;
	  text-transform: uppercase;
	}

	.body-band {
	  position: relative;
	  padding: 26px 34px 28px;
	  display: grid;
	  grid-template-columns: 1fr 220px;
	  gap: 24px;
	  align-items: end;
	}

	.copy {
	  color: #111;
	}

	.copy .line-1,
	.copy .line-2 {
	  font-size: clamp(28px, 4.2vw, 64px);
	  font-weight: 900;
	  line-height: 1.02;
	  margin: 0;
	  text-transform: none;
	}

	.copy .line-3 {
	  display: inline-block;
	  margin-top: 18px;
	  background: #111;
	  color: #f2d21b;
	  padding: 10px 16px 8px;
	  font-size: clamp(34px, 5.2vw, 74px);
	  font-weight: 900;
	  line-height: 1;
	  letter-spacing: 1px;
	}

	.badge-wrap {
	  display: flex;
	  justify-content: flex-end;
	  align-items: flex-end;
	}

	.badge {
	  width: 100%;
	  max-width: 200px;
	  aspect-ratio: 1 / 1;
	  background: #f5f0e8;
	  border: 8px solid #111;
	  border-radius: 999px 18px 18px 18px;
	  display: flex;
	  align-items: center;
	  justify-content: center;
	  padding: 18px;
	  transform: rotate(-3deg);
	}

	.badge-inner {
	  background: #f2d21b;
	  color: #111;
	  border: 6px solid #111;
	  padding: 14px 16px 12px;
	  font-weight: 900;
	  font-size: clamp(20px, 2.2vw, 34px);
	  line-height: 0.9;
	  text-transform: uppercase;
	  text-align: center;
	  transform: rotate(4deg);
	  box-shadow: 4px 4px 0 #111;
	}

	.subline {
	  margin-top: 18px;
	  font-size: clamp(14px, 1.5vw, 22px);
	  font-weight: 700;
	  line-height: 1.25;
	  color: #111;
	  opacity: 0.92;
	}

	.subline a {
	  color: inherit;
	  text-decoration-thickness: 3px;
	  text-underline-offset: 3px;
	}

	@media (max-width: 720px) {
	  .sticker {
		border-width: 12px;
		border-radius: 20px;
	  }

	  .top-band {
		padding: 18px 20px 14px;
	  }

	  .body-band {
		grid-template-columns: 1fr;
		gap: 18px;
		padding: 20px 20px 22px;
	  }

	  .badge-wrap {
		justify-content: flex-start;
	  }

	  .badge {
		max-width: 150px;
	  }

	  .sticker::before,
	  .sticker::after {
		width: 18px;
		background-size: 18px 20px;
	  }
	}
  </style>
</head>
<body>
  <div class="error-wrap">
	<div class="sticker">
	  <div class="top-band">401 ERROR</div>

	  <div class="body-band">
		<div class="copy">
		  <p class="line-1">Turn Your Computer off and go outside.</p>
		  <p class="line-2"> Trust Us. </p>
		  <div class="line-3">PAGE NOT FOUND.</div>

		  <div class="subline">
			maybe it moved, maybe it broke, maybe it was never here.<br>
			<a href="/">we will never know</a>
		  </div>
		</div>

		<div class="badge-wrap">
		  <div class="badge">
			<div class="badge-inner">
			  EPHEMERA<br>WEB
			</div>
		  </div>
		</div>
	  </div>
	</div>
  </div>
</body>
</html>
